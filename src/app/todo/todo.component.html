<!-- src/app/todo/todo.component.html -->
<div class="todo-container">
  <h2>My ToDo List</h2>

  <input
    [(ngModel)]="newTodo"
    (keyup.enter)="addTodo()"
    placeholder="Enter new task"
  />
  <button (click)="addTodo()">Add</button>

  <ul>
    <li *ngFor="let todo of todos; let i = index">
      {{ todo }}
      <button (click)="deleteTodo(i)">Delete</button>
    </li>
  </ul>
</div>
